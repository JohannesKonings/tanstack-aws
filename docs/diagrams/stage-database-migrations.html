<!DOCTYPE html>
<html lang="en">
<head>

  <title>Stage database migrations: generate once, apply three ways</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · docs/stage-database.md</p>
    <h1>Stage database migrations: generate once, apply three ways</h1>

    <div class="diagram-container">

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <rect x="816" y="80" width="424" height="512" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

        <line x1="40" y1="272" x2="800" y2="272" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="400" x2="800" y2="400" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="528" x2="800" y2="528" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

        <text x="40" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">GENERATE</text>

        <text x="40" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">APPLY · WORKLOAD DEPLOY</text>

        <line x1="376" y1="128" x2="408" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 540,152 V 216 Q 540,224 548,224 H 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 496,152 V 312 Q 496,320 504,320 H 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 452,152 V 472 Q 452,480 460,480 H 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="784" y1="224" x2="1096" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Workload deploy → Stage database -->
        <line x1="784" y1="312" x2="1096" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Workload deploy → Maintenance database -->
        <path d="M 784,328 H 908 Q 916,328 916,336 V 376" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 784,472 H 908 Q 916,472 916,464 V 424" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="940" y="294" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1010" y="303" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">migrateStageDatabaseSchema</text>

        <rect x="940" y="494" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1010" y="503" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">migrateStageDatabaseSchema</text>

        <rect x="1008" y="382" width="80" height="12" rx="2" fill="#f5f5f5"/>

        <!-- drizzle-kit migrate -->

        <text x="680" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">drizzle-kit migrate</text>
        <text x="680" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vp run drizzle-kit:migrate</text>

        <!-- Workload deploy -->
        <rect x="576" y="296" width="208" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="576" y="296" width="208" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Workload deploy</text>
        <text x="680" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AuroraSchemaLifecycle</text>

        <!-- migrate-stage-database.ts -->
        <rect x="576" y="456" width="208" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="576" y="456" width="208" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="478" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">migrate-stage-database.ts</text>
        <text x="680" y="492" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">packages/aurora/src/cli</text>

        <!-- Maintenance database (store) -->
        <rect x="832" y="376" width="168" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="832" y="376" width="168" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="916" y="398" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Maintenance database</text>
        <text x="916" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tanstackaws</text>

        <!-- Stage database (focal) -->
        <rect x="1096" y="136" width="128" height="440" rx="6" fill="#f5f5f5"/>

        <text x="1160" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stage database</text>

        <text x="380" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Files or database</text>

        <rect x="508" y="672" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="528" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Migration target</text>

        <line x1="652" y1="677" x2="680" y2="677" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="688" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flow</text>

        <line x1="752" y1="677" x2="780" y2="677" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="788" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Creates the stage database first</text>
      </svg>
    </div>
  </div>
