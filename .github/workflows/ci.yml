name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/_reusable-validate.yml
    permissions:
      contents: read
      checks: write
