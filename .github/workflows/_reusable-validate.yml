name: Reusable Validate

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          node-version-file: package.json
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Run checks
        run: vp check

      - name: Run tests
        run: |
          mkdir -p test-results
          vp run -r test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.junit.xml

      - name: Publish test report
        if: always() && hashFiles('test-results/vitest.junit.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: Vitest
          path: test-results/vitest.junit.xml
          reporter: java-junit

      - name: Upload test results artifact
        if: always() && hashFiles('test-results/vitest.junit.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: vitest-junit-report
          path: test-results/vitest.junit.xml
          retention-days: 7
          if-no-files-found: error

      - name: Build application
        run: vpr build && vp run webapp-admin:build
