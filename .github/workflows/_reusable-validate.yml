name: Reusable Validate

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          node-version-file: package.json
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Run checks
        run: vp check

      - name: Run tests
        run: mkdir -p test-results && vp test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.junit.xml

      - name: Publish test report
        if: always() && hashFiles('test-results/vitest.junit.xml') != ''
        uses: dorny/test-reporter@v2
        with:
          name: Vitest
          path: test-results/vitest.junit.xml
          reporter: java-junit

      - name: Upload test results artifact
        if: always() && hashFiles('test-results/vitest.junit.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: vitest-junit-report
          path: test-results/vitest.junit.xml
          retention-days: 7
          if-no-files-found: error

      - name: Build application
        run: vp build
