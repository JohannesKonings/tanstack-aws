name: Reusable CDK Diff

on:
  workflow_call:
    inputs:
      cdk_package:
        required: true
        type: string
      tag_id:
        required: true
        type: string
      aws_region:
        required: false
        default: us-east-2
        type: string
      stage_source:
        description: Raw stage ref passed to scripts/resolve-stage.ts. Omit for apps that do not use APP_STAGE.
        required: false
        default: ''
        type: string
      lifecycle:
        description: Stage lifecycle passed to scripts/resolve-stage.ts when stage_source is set.
        required: false
        default: ephemeral
        type: string
      build_apps:
        description: Build webapp and webapp-admin before cdk diff so asset paths exist.
        required: false
        default: false
        type: boolean
    secrets:
      aws_role_to_assume:
        required: true

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true
          node-version-file: package.json
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Build apps
        if: inputs.build_apps
        run: vpr build && vp run webapp-admin:build

      - name: Resolve stage name
        if: inputs.stage_source != ''
        id: resolve-stage
        env:
          STAGE_SOURCE: ${{ inputs.stage_source }}
          STAGE_LIFECYCLE: ${{ inputs.lifecycle }}
        run: |
          STAGE="$(node --import tsx scripts/resolve-stage.ts --stage "${STAGE_SOURCE}" --lifecycle "${STAGE_LIFECYCLE}")"
          echo "stage=${STAGE}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.aws_role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Install cdk-notifier
        run: |
          curl -L "https://github.com/karlderkaefer/cdk-notifier/releases/latest/download/cdk-notifier_$(uname)_amd64.gz" -o cdk-notifier.gz
          gunzip cdk-notifier.gz && chmod +x cdk-notifier && rm -rf cdk-notifier.gz
          sudo mv cdk-notifier /usr/local/bin/cdk-notifier
          cdk-notifier --version

      - name: CDK diff and post PR comment
        env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.aws-credentials.outputs.aws-account-id }}
          GITHUB_TOKEN: ${{ github.token }}
          RESOLVED_STAGE: ${{ steps.resolve-stage.outputs.stage }}
        run: |
          if [ -n "${RESOLVED_STAGE}" ]; then
            export APP_STAGE="${RESOLVED_STAGE}"
          fi
          vp -C "${{ inputs.cdk_package }}" exec cdk diff 2>&1 | tee cdk-diff.log || true
          cdk-notifier \
            --vcs github \
            --owner "${{ github.repository_owner }}" \
            --repo "$(echo '${{ github.repository }}' | cut -d'/' -f2)" \
            --pull-request-id "${{ github.event.pull_request.number }}" \
            --log-file ./cdk-diff.log \
            --tag-id "${{ inputs.tag_id }}" \
            --token "${GITHUB_TOKEN}"
