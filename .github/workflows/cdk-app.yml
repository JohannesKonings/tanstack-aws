name: CDK App

on:
  pull_request:
    paths:
      - 'apps/cdk-app/**'
      - 'lib/resource-tags.ts'
      - 'lib/stage-name.ts'
      - 'lib/workload-region.ts'
      - 'lib/sse-stream-timeout.ts'
      - 'src/lambda/**'
      - '.github/workflows/cdk-app.yml'
      - '.github/workflows/_reusable-cdk-diff.yml'

concurrency:
  group: cdk-app-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_reusable-cdk-diff.yml
    with:
      cdk_package: apps/cdk-app
      tag_id: cdk-app
      stage_source: ${{ github.event.pull_request.head.ref }}
      lifecycle: ephemeral
      build_apps: true
    secrets:
      aws_role_to_assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true
          node-version-file: package.json
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Run checks
        run: vp check apps/cdk-app

      - name: Run tests
        run: mkdir -p test-results && vp -C apps/cdk-app test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.junit.xml

      - name: Publish test report
        if: always() && hashFiles('test-results/vitest.junit.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: CDK App Vitest
          path: test-results/vitest.junit.xml
          reporter: java-junit

      - name: Upload test results artifact
        if: always() && hashFiles('test-results/vitest.junit.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: cdk-app-vitest-junit-report
          path: test-results/vitest.junit.xml
          retention-days: 7
          if-no-files-found: error
