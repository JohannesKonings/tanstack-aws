name: Account Setup

on:
  pull_request:
    paths:
      - 'apps/cdk-account-setup/**'
      - '.github/workflows/account-setup.yml'
      - '.github/workflows/_reusable-cdk-diff.yml'
      - 'scripts/read-envs-secret-key.sh'
  push:
    branches:
      - main
    paths:
      - 'apps/cdk-account-setup/**'
      - '.github/workflows/account-setup.yml'
      - '.github/workflows/_reusable-cdk-diff.yml'
      - 'scripts/read-envs-secret-key.sh'
  workflow_dispatch:

concurrency:
  group: account-setup-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_reusable-cdk-diff.yml
    with:
      cdk_package: apps/cdk-account-setup
      tag_id: account-setup
      aws_region: us-east-1
      fetch_account_setup_context: true
    secrets:
      aws_role_to_assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write

  validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          node-version-file: package.json
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Run checks
        run: vp check apps/cdk-account-setup

      - name: Run tests
        run: mkdir -p test-results && vp -C apps/cdk-account-setup test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.junit.xml

      - name: Publish test report
        if: always() && hashFiles('test-results/vitest.junit.xml') != ''
        uses: dorny/test-reporter@v3
        with:
          name: Account Setup Vitest
          path: test-results/vitest.junit.xml
          reporter: java-junit

      - name: Upload test results artifact
        if: always() && hashFiles('test-results/vitest.junit.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: account-setup-vitest-junit-report
          path: test-results/vitest.junit.xml
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: >-
      always() &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          node-version-file: package.json
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Configure AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Deploy all account setup stacks
        env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.aws-credentials.outputs.aws-account-id }}
        run: |
          CURSOR_OIDC_SUBJECT="$(bash scripts/read-envs-secret-key.sh API_CURSOR_SUB)" || exit 1
          GROK_BOT_ALARM_WEBHOOK_URL="$(bash scripts/read-envs-secret-key.sh GROK_BOT_ALARM_WEBHOOK_URL)" || exit 1
          bash scripts/read-envs-secret-key.sh GROK_BOT_ALARM_WEBHOOK_TOKEN >/dev/null || exit 1
          echo "::add-mask::${CURSOR_OIDC_SUBJECT}"
          echo "::add-mask::${GROK_BOT_ALARM_WEBHOOK_URL}"
          vp -C apps/cdk-account-setup exec -- varlock run -- cdk deploy --all --require-approval never -c "cursorOidcSubject=${CURSOR_OIDC_SUBJECT}" -c "grokBotAlarmWebhookUrl=${GROK_BOT_ALARM_WEBHOOK_URL}"
