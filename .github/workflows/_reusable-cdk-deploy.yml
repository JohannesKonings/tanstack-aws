name: Reusable CDK Deploy

on:
  workflow_call:
    inputs:
      stage_source:
        required: true
        type: string
      lifecycle:
        required: true
        type: string
      stack_prefix:
        required: false
        default: TanstackAwsStack
        type: string
      github_environment:
        required: false
        default: ''
        type: string
    secrets:
      aws_role_to_assume:
        required: true
    outputs:
      stage:
        description: Resolved stage name
        value: ${{ jobs.deploy.outputs.stage }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      stage: ${{ steps.resolve-stage.outputs.stage }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          node-version-file: package.json
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Build
        run: vpr build && vp run webapp-admin:build

      - name: Resolve stage name
        id: resolve-stage
        env:
          STAGE_SOURCE: ${{ inputs.stage_source }}
          STAGE_LIFECYCLE: ${{ inputs.lifecycle }}
        run: |
          STAGE="$(vpx scripts/resolve-stage.ts --stage "${STAGE_SOURCE}" --lifecycle "${STAGE_LIFECYCLE}")"
          echo "stage=${STAGE}" >> "$GITHUB_OUTPUT"

      - name: Resolve workload region
        id: resolve-workload-region
        run: |
          WORKLOAD_REGION="$(vpx scripts/resolve-workload-region.ts)"
          echo "workload_region=${WORKLOAD_REGION}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.aws_role_to_assume }}
          aws-region: ${{ steps.resolve-workload-region.outputs.workload_region }}

      - name: Deploy stack
        env:
          APP_STAGE: ${{ steps.resolve-stage.outputs.stage }}
          STACK_PREFIX: ${{ inputs.stack_prefix }}
          CDK_DEFAULT_ACCOUNT: ${{ steps.aws-credentials.outputs.aws-account-id }}
        # vp exec (not vp run) passes AWS credentials through to CDK; vp run filters them in Vite+ 1.0.
        run: vp -C apps/cdk-app exec -- varlock run -- cdk deploy "${STACK_PREFIX}-${APP_STAGE}" --require-approval never
