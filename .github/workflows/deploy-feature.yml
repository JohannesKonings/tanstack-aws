name: Deploy Feature Stack

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

jobs:
  deploy-feature:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch != 'main' && github.event.workflow_run.head_branch != 'prod' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          node-version-file: .node-version

      - name: Install dependencies
        run: vp install

      - name: Resolve stage name
        id: resolve-stage
        env:
          STAGE_SOURCE: ${{ github.event.workflow_run.head_branch }}
        run: |
          STAGE="$(vp exec tsx scripts/resolve-stage.ts --stage "${STAGE_SOURCE}" --lifecycle ephemeral)"
          echo "stage=${STAGE}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Deploy ephemeral stack
        env:
          APP_STAGE: ${{ steps.resolve-stage.outputs.stage }}
        run: vp run cdk -- deploy "TanstackAwsStack-${APP_STAGE}" --require-approval never
