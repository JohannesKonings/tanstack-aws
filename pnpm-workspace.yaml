minimumReleaseAge: 2880
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@jaykingson/vite-plus-base'
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - tsrs
  - '@tsrs/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'
  # Renovate security update: @tanstack/react-start@1.168.60
  - "@tanstack/react-start@1.168.60"

packages:
  - .
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  msw: true
catalog:
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
  zod: 4.6.7
overrides:
  vite@*: 'catalog:'
